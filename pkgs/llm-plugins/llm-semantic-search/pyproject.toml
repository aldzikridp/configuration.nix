[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-semantic-search"
version = "0.1.0"
description = "LLM plugin providing semantic search via semsearch HTTP server."
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "EVA-02" }]
keywords = ["llm", "llm-plugin", "semsearch", "semantic-search", "pgvector", "http"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "llm>=0.26",
    "pyyaml",
    "httpx2",
]

[project.entry-points.llm]
semantic_search = "llm_semantic_search"

[tool.setuptools]
py-modules = ["llm_semantic_search"]
