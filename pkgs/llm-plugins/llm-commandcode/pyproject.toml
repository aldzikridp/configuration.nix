[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-commandcode"
version = "0.1.0"
description = "LLM plugin providing Command Code (commandcode.ai) models with streaming, tools, reasoning, and image input."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "ported from pi-commandcode-provider" }]
keywords = ["llm", "llm-plugin", "commandcode", "provider", "models", "tools"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "llm>=0.26",
    "httpx",
]

[project.optional-dependencies]
test = ["pytest"]

# Entry point that tells llm how to load this plugin.
# Left-hand side ("commandcode") is the plugin name shown by `llm plugins`.
# Right-hand side ("llm_commandcode") is the importable module that contains
# the @llm.hookimpl def register_models(register, model_aliases): function.
[project.entry-points.llm]
commandcode = "llm_commandcode"

[tool.setuptools]
py-modules = ["llm_commandcode"]