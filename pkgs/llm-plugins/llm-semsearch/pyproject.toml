[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-semsearch"
version = "0.1.0"
description = "LLM plugin providing semantic search over local documents via semsearch."
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "EVA-02" }]
keywords = ["llm", "llm-plugin", "semsearch", "semantic-search", "pgvector"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "llm>=0.26",
    "pyyaml",
    "pg-semantic-search",
]

[project.entry-points.llm]
semsearch = "llm_semsearch"

[tool.setuptools]
py-modules = ["llm_semsearch"]
